openapi: 3.0.3
info:
  title: My Flash Cards API
  version: 1.0.0
  description: |
    API สำหรับคลังคำศัพท์ชุดเดียว หนึ่งคำสะกดมีหนึ่งบัตรและเก็บชนิดของคำ
    กับความหมายเป็นรายการอิสระ ดู User Stories และ Acceptance Criteria ใน docs/
    ของ repository

    เมื่อ backend ตั้ง APP_PASSWORD ทุก path ยกเว้น /api/health, /api/session และ
    /api/login ต้องส่ง Authorization: Bearer <token> ที่ได้จาก /api/login
    ไม่เช่นนั้นตอบ 401; ถ้าไม่ตั้ง APP_PASSWORD ทุก path เปิดใช้ได้โดยไม่ต้องมี token
servers:
  - url: https://my-flash-cards-puce.vercel.app
    description: Vercel
  - url: http://127.0.0.1:3001
    description: Local backend
security:
  - session: []
tags:
  - name: Health
    description: ตรวจการเริ่มทำงานของ backend
  - name: Auth
    description: เข้าสู่ระบบด้วยรหัสผ่านเดียวของแอป (APP_PASSWORD)
  - name: Study
    description: บันทึกคำตอบ Challenge ตารางทบทวน และสถิติการฝึก
  - name: Cards
    description: จัดการบัตรคำศัพท์และสถานะต้องทบทวน
  - name: Import
    description: นำเข้าข้อมูลคำศัพท์จาก CSV
paths:
  /api/health:
    get:
      tags: [Health]
      security: []
      operationId: getHealth
      summary: ตรวจว่า backend เริ่มทำงานสำเร็จ
      responses:
        '200':
          description: Backend พร้อมตอบคำขอ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                ok: true
  /api/session:
    get:
      tags: [Auth]
      security: []
      operationId: getSession
      summary: บอกว่าต้องใช้รหัสผ่านหรือไม่ และ token ที่ส่งมายังใช้ได้หรือไม่
      responses:
        '200':
          description: สถานะการเข้าสู่ระบบ
          content:
            application/json:
              schema:
                type: object
                required: [authRequired, authenticated]
                properties:
                  authRequired:
                    type: boolean
                  authenticated:
                    type: boolean
              example:
                authRequired: true
                authenticated: false
  /api/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: แลก APP_PASSWORD เป็น token ที่ใช้ได้ 30 วัน
      description: |
        ใส่รหัสผ่านผิด 5 ครั้งจากที่อยู่เดียวกัน หรือรวม 50 ครั้งภายใน 15 นาที จะถูกปฏิเสธด้วย 429
        (นับจากตาราง login_failures ในฐานข้อมูล)
        การเปลี่ยน APP_PASSWORD ทำให้ token เดิมทั้งหมดใช้ไม่ได้
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        '200':
          description: token สำหรับ header Authorization (ว่างเมื่อไม่ได้ตั้งรหัสผ่าน)
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: ใส่รหัสผ่านผิดหลายครั้งเกินไป
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: แสดงบัตรคำศัพท์ทั้งหมด
      description: เรียงตามคำสะกดโดยไม่สนตัวพิมพ์; ตัวกรองและการค้นหาอยู่ที่ frontend
      responses:
        '200':
          description: รายการบัตร อาจเป็น array ว่าง
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Cards]
      operationId: createCard
      summary: เพิ่มบัตรคำศัพท์
      description: |
        คำสะกดซ้ำโดยไม่สนตัวพิมพ์เพิ่มเป็นบัตรใหม่ไม่ได้ แม้ชนิดของคำต่างกัน
        ให้แก้ไขบัตรเดิมเพื่อเพิ่มชนิดหรือความหมาย
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardInput'
            example:
              word: run
              partsOfSpeech: [verb, noun]
              meanings: [วิ่ง, การวิ่ง]
              hint: ใช้ขา
      responses:
        '201':
          description: เพิ่มบัตรแล้ว
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/cards/{id}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    put:
      tags: [Cards]
      operationId: updateCard
      summary: แทนรายละเอียดคำศัพท์ของบัตร
      description: ต้องส่งคำสะกด ชนิดของคำ และความหมายครบ; สถานะต้องทบทวนคงเดิม
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardInput'
      responses:
        '200':
          description: บัตรหลังแก้ไข
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: ลบบัตรคำศัพท์
      responses:
        '204':
          description: ลบแล้ว ไม่มี response body
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/cards/{id}/review:
    parameters:
      - $ref: '#/components/parameters/CardId'
    patch:
      tags: [Cards]
      operationId: setCardReview
      summary: ตั้งสถานะต้องทบทวน
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [needsReview]
              properties:
                needsReview:
                  type: boolean
            example:
              needsReview: true
      responses:
        '200':
          description: บัตรหลังเปลี่ยนสถานะ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/cards/{id}/answer:
    parameters:
      - $ref: '#/components/parameters/CardId'
    post:
      tags: [Study]
      operationId: answerCard
      summary: บันทึกคำตอบ Challenge และจัดวันทบทวนครั้งถัดไป
      description: |
        ตอบถูกเลื่อน srsStep ขึ้นหนึ่งขั้นและตั้ง dueOn เป็น today บวก 1, 3, 7, 14, 30 หรือ 60 วันตามขั้น
        ตอบผิดตั้ง srsStep เป็น 0 และ dueOn เป็น today
        พร้อมตั้ง needsReview เป็นค่าตรงข้ามกับ correct นับ correctCount/wrongCount ตั้ง firstStudiedOn เมื่อยังว่าง และบันทึกลงประวัติการฝึก
        Response ถูกบีบอัด gzip เมื่อ client รองรับ (ใช้กับทุก path)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correct]
              properties:
                correct:
                  type: boolean
                today:
                  type: string
                  format: date
                  description: วันที่ตามเวลาท้องถิ่นของผู้เรียน (YYYY-MM-DD); ถ้าไม่ส่งใช้วันที่ UTC ของเซิร์ฟเวอร์
            example:
              correct: true
              today: '2026-11-03'
      responses:
        '200':
          description: บัตรหลังบันทึกคำตอบ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/study-days:
    get:
      tags: [Study]
      operationId: listStudyDays
      summary: จำนวนคำตอบรายวัน ใช้คำนวณวันที่ฝึกต่อเนื่องและกราฟสถิติ
      description: เรียงจากวันล่าสุด ไม่เกิน 400 วัน; ประวัติยังอยู่แม้ลบบัตรไปแล้ว
      responses:
        '200':
          description: รายการวันที่มีการตอบ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyDay'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/cards/import:
    post:
      tags: [Import]
      operationId: importCardsCsv
      summary: นำเข้าคำศัพท์จาก CSV
      description: |
        ไฟล์ UTF-8 ขนาดไม่เกิน 5 MiB ต้องมีหัวคอลัมน์
        คำศัพท์,ชนิดของคำ,ความหมาย ตามลำดับ หรือแบบเต็ม 5 คอลัมน์
        คำศัพท์,ชนิดของคำ,ความหมาย,คำใบ้,ตัวอย่างประโยค (รูปแบบที่ส่งออกจากหน้าเว็บ)
        ซึ่งแต่ละแถวต้องมี 5 ช่องพอดีและความหมายหลายค่าต้องครอบด้วยเครื่องหมายคำพูด
        คำใบ้และตัวอย่างประโยคใช้กับคำใหม่เท่านั้น รองรับ BOM และช่องที่มีหลายค่า
        คั่นด้วย comma เมื่อครอบด้วยเครื่องหมายคำพูดตามรูปแบบ CSV
        ยอมรับช่องว่างก่อนเครื่องหมายคำพูดและความหมายที่คั่นด้วย comma โดยไม่ครอบช่อง
        แต่หลายชนิดของคำในช่องเดียวต้องครอบด้วยเครื่องหมายคำพูด
        แถวคำสะกดเดิมจะรวมเฉพาะชนิดและความหมายใหม่ ไม่เปลี่ยนคำใบ้หรือสถานะทบทวน
        การบันทึกทั้งไฟล์เป็น atomic; ถ้าบันทึกไม่สำเร็จจะไม่มีการเพิ่มข้อมูลจากรอบนั้น
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ไฟล์ CSV UTF-8
      responses:
        '200':
          description: ผลนำเข้าแยกจำนวนแถวที่เพิ่ม รวม ข้าม และผิดรูปแบบ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
              example:
                added: 1
                merged: 1
                skipped: 1
                invalid: 1
                issues:
                  - row: 4
                    word: Run
                    kind: skipped
                    reason: ข้อมูลของคำนี้มีอยู่แล้ว
                  - row: 5
                    word: Bad
                    kind: invalid
                    reason: ไม่มีความหมาย
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: ไฟล์ CSV ใหญ่เกิน 5 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: token จาก /api/login ใช้เมื่อ backend ตั้ง APP_PASSWORD
  parameters:
    CardId:
      name: id
      in: path
      required: true
      description: ID ของบัตรคำศัพท์
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Unauthorized:
      description: ยังไม่ได้เข้าสู่ระบบ token หมดอายุ หรือรหัสผ่านไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: ID, JSON หรือข้อมูลบัตร/CSV ไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: ไม่พบบัตรตาม ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: คำสะกดซ้ำกับบัตรที่มีอยู่
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: เกิดข้อผิดพลาดฝั่งเซิร์ฟเวอร์
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    CardInput:
      type: object
      description: |
        รูปแบบหลักใช้ partsOfSpeech และ meanings เป็นรายการอิสระ
        API ยังรับ partOfSpeech และ meaning แบบ string เดิมเพื่อความเข้ากันได้
        หากส่งทั้งแบบรายการและแบบเดิม ระบบใช้รายการก่อน
        ระบบตัดช่องว่างและยกตัวแรกของ word เป็นตัวใหญ่
      required: [word]
      allOf:
        - anyOf:
            - required: [partsOfSpeech]
            - required: [partOfSpeech]
        - anyOf:
            - required: [meanings]
            - required: [meaning]
      properties:
        word:
          type: string
          minLength: 1
          description: คำอังกฤษ; ต้องไม่เป็นช่องว่างล้วน
        partsOfSpeech:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: รายการชนิดของคำ ไม่จับคู่ตามตำแหน่งกับ meanings
        meanings:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: รายการความหมายภาษาไทย
        partOfSpeech:
          type: string
          minLength: 1
          deprecated: true
          description: ค่าเดียวแบบเดิม ใช้เมื่อไม่ส่ง partsOfSpeech
        meaning:
          type: string
          minLength: 1
          deprecated: true
          description: ค่าเดียวแบบเดิม ใช้เมื่อไม่ส่ง meanings
        hint:
          type: string
          description: คำใบ้ ไม่บังคับ; ค่าเริ่มต้นเป็นข้อความว่าง
        example:
          type: string
          description: ตัวอย่างประโยค ไม่บังคับ; ค่าเริ่มต้นเป็นข้อความว่าง
    Card:
      type: object
      required: [id, word, partsOfSpeech, meanings, partOfSpeech, meaning, hint, example, needsReview, srsStep, dueOn, correctCount, wrongCount, firstStudiedOn]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        word:
          type: string
        partsOfSpeech:
          type: array
          items:
            type: string
        meanings:
          type: array
          items:
            type: string
        partOfSpeech:
          type: string
          deprecated: true
          description: รายการชนิดของคำที่รวมเป็นข้อความคั่นด้วย comma เพื่อความเข้ากันได้
        meaning:
          type: string
          deprecated: true
          description: รายการความหมายที่รวมเป็นข้อความคั่นด้วย comma เพื่อความเข้ากันได้
        hint:
          type: string
        example:
          type: string
        needsReview:
          type: boolean
        srsStep:
          type: integer
          minimum: 0
          maximum: 6
          description: จำนวนครั้งที่ตอบถูกติดกันใน Challenge (สูงสุด 6)
        dueOn:
          type: string
          format: date
          nullable: true
          description: วันที่ถึงกำหนดทบทวน; null เมื่อยังไม่เคยตอบใน Challenge
        correctCount:
          type: integer
          minimum: 0
        wrongCount:
          type: integer
          minimum: 0
        firstStudiedOn:
          type: string
          format: date
          nullable: true
          description: วันที่ตอบคำนี้ใน Challenge ครั้งแรก; null เมื่อยังเป็นคำใหม่
      example:
        id: 12
        word: Run
        partsOfSpeech: [verb, noun]
        meanings: [วิ่ง, การวิ่ง]
        partOfSpeech: verb, noun
        meaning: วิ่ง, การวิ่ง
        hint: ใช้ขา
        example: I run every morning.
        needsReview: false
        srsStep: 2
        dueOn: '2026-11-06'
        correctCount: 4
        wrongCount: 1
        firstStudiedOn: '2026-10-20'
    StudyDay:
      type: object
      required: [date, answers, correct]
      properties:
        date:
          type: string
          format: date
        answers:
          type: integer
          minimum: 1
        correct:
          type: integer
          minimum: 0
    ImportIssue:
      type: object
      required: [row, kind, reason]
      properties:
        row:
          type: integer
          minimum: 2
          description: ลำดับแถวข้อมูลในไฟล์ (หัวคอลัมน์คือแถว 1)
        word:
          type: string
          description: คำศัพท์ในแถว หากอ่านได้จากไฟล์
        kind:
          type: string
          enum: [skipped, invalid]
          description: ข้ามเพราะข้อมูลซ้ำ หรือข้อมูลผิดรูปแบบ/ไม่ครบ
        reason:
          type: string
    ImportResult:
      type: object
      required: [added, merged, skipped, invalid, issues]
      properties:
        added:
          type: integer
          minimum: 0
          description: จำนวนแถวที่สร้างคำสะกดใหม่
        merged:
          type: integer
          minimum: 0
          description: จำนวนแถวที่เพิ่มชนิดหรือความหมายให้คำสะกดเดิม
        skipped:
          type: integer
          minimum: 0
          description: จำนวนแถวที่ไม่มีข้อมูลใหม่
        invalid:
          type: integer
          minimum: 0
          description: จำนวนแถวผิดรูปแบบหรือข้อมูลไม่ครบ
        issues:
          type: array
          description: รายการแถวที่ข้ามหรือผิดรูปแบบ พร้อมคำศัพท์และเหตุผล
          items:
            $ref: '#/components/schemas/ImportIssue'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
